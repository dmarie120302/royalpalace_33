# Configuration for the new Royal Palace project; it is not linked to an existing account.
project_id = "royalpalace-33"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
# Production domain is pending. Set the approved domain in the new account before inviting users.
site_url = "http://localhost:3100"
# Invitation/recovery uses /account; callback and confirmation URLs must also be allowlisted.
additional_redirect_urls = ["http://localhost:3100/account", "http://localhost:3100/auth/callback", "http://localhost:3100/auth/confirm", "http://127.0.0.1:3100/account", "http://127.0.0.1:3100/auth/callback", "http://127.0.0.1:3100/auth/confirm"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
