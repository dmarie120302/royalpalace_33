<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PH 33 Royal Palace</title>
<style>
:root{--c:#4a4fc4;--bg:#f4f6f5;--card:#fff;--line:#dde3e0;--txt:#1d2b27;--mut:#6b7a75;--warn:#b5472b;--lbl:170px}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);-webkit-text-size-adjust:100%}
header{background:var(--c);color:#fff;padding:16px 18px}
header .fila h1{margin:0;font-size:clamp(1.05rem,3.6vw,1.3rem)}
.resumen{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:.9rem}
.resumen b{display:block;font-size:clamp(.95rem,3vw,1.15rem)}
main{max-width:1000px;margin:0 auto;padding:14px}
.barra{height:12px;background:#e3e9e6;border-radius:8px;overflow:hidden;margin:8px 0}
.barra>span{display:block;height:100%;background:var(--c);transition:width .4s}
.barra.alta>span{background:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:1.05rem}
.meta{color:var(--mut);font-size:.85rem}
.fila{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:0;border-radius:8px;padding:8px 12px;background:var(--c);color:#fff;cursor:pointer}
button.sec{background:#e9efec;color:var(--txt)}
button.peligro{background:var(--warn)}
button.mini{padding:2px 7px;font-size:.8rem}
input,textarea,select{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;margin-top:3px;background:#fff;max-width:100%}
select{width:auto;min-width:160px}
label{font-size:.85rem;color:var(--mut);display:block;margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.9rem}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
.miniatura{width:44px;height:44px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:12px;z-index:9}
.modal.abierto{display:flex}
.modal>div{background:#fff;border-radius:12px;padding:18px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
.modal img{max-width:100%;border-radius:8px}
.oculto{display:none!important}
.badge{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:10px;background:#fbe9d7;color:#8a4b12;margin-left:4px;vertical-align:middle}
.fila-fechas{display:flex;gap:10px;flex-wrap:wrap}
.fila-fechas>div{flex:1;min-width:150px}

/* Barra de menú */
.menu{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.menu-in{max-width:1000px;margin:0 auto;padding:4px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:thin}
.tab{background:none;color:var(--mut);padding:10px 12px;border-radius:0;border-bottom:3px solid transparent;white-space:nowrap;flex-shrink:0}
.tab:hover{color:var(--txt)}
.tab.act{color:var(--c);border-bottom-color:var(--c);font-weight:600}
.acciones{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* Iconos, chips y selectores */
.ico{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ico.big{width:46px;height:46px}
.ico.big svg{width:26px;height:26px}
.ico svg{width:18px;height:18px}
.punto{width:12px;height:12px;border-radius:50%;display:inline-block;vertical-align:middle;flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid;border-radius:20px;padding:2px 10px 2px 3px;font-size:.85rem;font-weight:600;background:#fff;margin:0 4px 4px 0}
.chip .ico{width:24px;height:24px}
.chip .ico svg{width:15px;height:15px}
.picker{border:1px solid var(--line);border-radius:8px;background:#fff;margin-top:3px}
.picker>summary{list-style:none;cursor:pointer;padding:7px 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:42px}
.picker>summary::-webkit-details-marker{display:none}
.picker-lista{padding:6px 8px;border-top:1px solid var(--line);max-height:40vh;overflow:auto}
.pi{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:6px;cursor:pointer;color:var(--txt);font-size:.92rem}
.pi:hover{background:#f3f6f5}
.pi input{width:auto;margin:0}
.grid-esp{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.esp-card{margin:0}
.grid-iconos{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin-top:4px}
.icono-btn{background:#f3f6f5;color:var(--txt);padding:10px;display:flex;justify-content:center;border:2px solid transparent}
.icono-btn.sel{border-color:var(--c);background:#e8f3ef}
.paleta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.swatch{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swatch.sel{border-color:var(--txt)}
.strip{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px;align-items:center}

/* Barras de progreso animadas */
@keyframes crecer{from{width:0}}
.progreso{background:#eceef8;border-radius:14px;height:24px;overflow:hidden;position:relative;margin:8px 0;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.progreso>span{display:block;height:100%;border-radius:14px;background:linear-gradient(90deg,var(--c),#8a8fe6);animation:crecer 1.1s ease-out;transition:width .6s;position:relative;overflow:hidden}
.progreso>span::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 8px,transparent 8px 16px);animation:rayas 1.5s linear infinite}
@keyframes rayas{from{background-position:0 0}to{background-position:32px 0}}
.progreso b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.82rem;color:#1d2b27;text-shadow:0 0 6px #fff}
.progreso.verde>span{background:linear-gradient(90deg,#2f855a,#6fc79a)}
.progreso.alerta>span{background:linear-gradient(90deg,#c05621,#f0a06b)}
.progreso.inicio>span{background:linear-gradient(90deg,#8a8fe6,#b9bdf2)}
.progreso:hover>span{filter:brightness(1.08)}
.resumen-c{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.resumen-c .kpi b{font-size:1.15rem}
.saludo{background:linear-gradient(135deg,var(--c),#7d82e0);color:#fff;border-radius:14px;padding:16px;margin-bottom:14px}
.saludo h2{margin:0;font-size:1.2rem}
.saludo .meta{color:#eef0ff}
.saludo .progreso{background:rgba(255,255,255,.3)}
.saludo .progreso b{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.25)}
details.trab{margin:6px 0;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
details.trab>summary{cursor:pointer;list-style:none}
details.trab>summary::-webkit-details-marker{display:none}

/* Cronograma (solo visualización) */
.cr-controles{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.cr-grupo-btns{display:flex;gap:6px;flex-wrap:wrap}
.cr-btn{background:#fff;color:var(--txt);border:1.5px solid var(--line);padding:6px 10px;font-size:.88rem}
.cr-btn.act{background:var(--c);color:#fff;border-color:var(--c)}
.cr-btn.off{opacity:.45}
.cr-leyenda{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--mut);margin:6px 0 10px;align-items:center}
.cr-leyenda span{display:inline-flex;align-items:center;gap:6px}
.cr-sq{display:inline-block;width:12px;height:12px;border-radius:3px}
.cr-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;-webkit-overflow-scrolling:touch;max-width:100%;padding-bottom:8px}
.cr-inner{position:relative;min-width:max-content}
.cr-row{display:flex;border-bottom:1px solid #eef1f0}
.cr-lbl{position:sticky;left:0;z-index:3;background:#fff;width:var(--lbl);flex-shrink:0;padding:0 8px;border-right:1px solid var(--line);font-size:.8rem;display:flex;align-items:center;gap:6px;overflow:hidden;box-sizing:border-box;cursor:default}
.cr-lbl .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr-trab-lbl{cursor:pointer}
.cr-trab-lbl:hover{background:#f6f8ff}
.cr-tl{position:relative;flex-shrink:0;background-image:linear-gradient(90deg,#edf1ef 1px,transparent 1px),linear-gradient(180deg,#edf1ef 1px,transparent 1px)}
.cr-grupo .cr-lbl{background:#f3f5fb;font-weight:700;color:var(--txt)}
.cr-grupo .cr-tl{background-color:#f3f5fb}
.cr-head .cr-lbl{font-weight:600;color:var(--mut)}
.cr-head .cr-tl{background-image:none}
.cr-mes{position:absolute;top:0;height:22px;line-height:22px;font-size:.76rem;font-weight:700;color:#fff;background:var(--c);padding:0 6px;overflow:hidden;white-space:nowrap;border-right:2px solid #fff;text-transform:capitalize;box-sizing:border-box}
.cr-dia{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.7rem;color:var(--mut);border-right:1px solid #e6ebe9;box-sizing:border-box;overflow:hidden;background:#fff}
.cr-dia b{font-size:.8rem;color:var(--txt);line-height:1}
.cr-dia small{font-size:.6rem;line-height:1.2}
.cr-dia.hoy{background:#fde8e6;color:#b5472b}
.cr-dia.hoy b{color:#b5472b}
.cr-dia.sem{align-items:flex-start;justify-content:center;padding-left:4px;color:var(--txt)}
.cr-col{position:absolute;top:0;bottom:0;z-index:1;pointer-events:none;box-sizing:border-box}
.cr-col.fds{background:rgba(0,0,0,.04)}
.cr-col.hoy{background:rgba(224,68,58,.10);border-left:2px solid #e0443a;border-right:2px solid #e0443a}
.cr-cuad{position:absolute;z-index:2;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.66rem;font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);transition:transform .12s,opacity .2s}
.cr-cuad:hover{transform:scale(1.12);z-index:4}
.cr-sec{position:sticky;left:0;background:var(--tc,var(--c));color:#fff;font-weight:700;font-size:.85rem;padding:6px 10px;box-sizing:border-box}
.cr-sinfecha span.tag-s{display:inline-block;border:1px dashed #b8c2be;border-radius:14px;padding:3px 10px;margin:3px;font-size:.85rem}

/* Filtros y reportes */
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.filtros .campo{display:flex;flex-direction:column;gap:3px;flex:1;min-width:150px}
.filtros .campo span{font-size:.8rem;color:var(--mut)}
.filtros select{min-width:0;width:100%}
.resumen-filtro{font-size:.9rem;margin:0 0 12px}
.resumen-filtro b{color:var(--c)}
.solo-imprimir{display:none}

/* Análisis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi span{display:block;color:var(--mut);font-size:.8rem}
.kpi b{font-size:1.1rem}
.seccion{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.seccion h3{margin:0 0 6px;font-size:1rem}
.pie-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.pie{width:200px;height:200px;flex-shrink:0;max-width:100%}
.leyenda{flex:1;min-width:200px}
.leyenda-item{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:.9rem;flex-wrap:wrap}
.leyenda-item b{margin-left:auto}
.svg-wrap{overflow-x:auto;max-width:100%}
.prev-grid{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.prev-grid img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.galeria img{display:block;width:100%;margin-bottom:8px;border-radius:8px}
.fase-bloque{border-left:5px solid;padding-left:12px;margin:18px 0 6px}
.fase-bloque h3{margin:0;font-size:1.05rem}

/* Pantalla de entrada */
#puerta{position:fixed;inset:0;background:var(--c);display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}
#puerta .caja{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:360px;text-align:center}
#puerta select{width:100%;min-width:0;text-align:left}
#puerta input{text-align:center;font-size:1.2rem;letter-spacing:4px}

/* Títulos con icono y color */
.tit{display:flex;align-items:center;gap:8px;color:var(--tc)}
.tit-ico{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.seccion h3.tit{font-size:1.02rem}
.fase-bloque h3.tit{color:var(--tc)}

/* Solo el administrador ve controles de edición */
body:not(.edita) .solo-dueno{display:none!important}

/* Adaptación a cualquier tamaño de pantalla */
@media (max-width:700px){
  :root{--lbl:118px}
  header{padding:14px}
  .resumen{gap:10px}
  .card,.seccion{padding:12px}
  .kpi b{font-size:1rem}
  .fila-fechas>div{min-width:100%}
  .modal>div{padding:14px}
  table{display:block;overflow-x:auto;white-space:nowrap}
  td,th{padding:6px 5px}
  .cr-lbl{font-size:.72rem;padding:0 6px}
  .cr-controles{gap:6px}
  .acciones button{padding:7px 10px;font-size:.88rem}
  .leyenda{min-width:0}
  .pie{width:170px;height:170px}
}
@media (max-width:420px){
  :root{--lbl:96px}
  .tab{padding:9px 9px;font-size:.9rem}
  .progreso b{font-size:.75rem}
}
@media (min-width:1100px){
  main{padding:20px}
}

@media print{
  body{background:#fff}
  .menu,.no-imprimir,.solo-dueno,#btn-salir,.cr-controles{display:none!important}
  .solo-imprimir{display:block!important;margin-bottom:12px}
  main{padding:0}
  .seccion,.kpi,.filtros{break-inside:avoid}
  header{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

<header>

    <h1 id="t-titulo">PH 33 Royal Palace</h1>
    <button class="sec oculto" id="btn-salir">Salir</button>
  </div>
  <div class="resumen" id="resumen">
    <div>Presupuesto total<b id="t-presup">$0.00</b></div>
    <div>Pagado<b id="t-pagado">$0.00</b></div>
    <div>Pendiente<b id="t-pend">$0.00</b></div>
  </div>
  <div class="barra" id="barra-global" style="background:rgba(255,255,255,.25)"><span id="t-barra" style="background:#fff"></span></div>
</header>

<nav class="menu oculto">
  <div class="menu-in">
    <div class="tabs">
      <button class="tab act" data-v="trabajos" onclick="cambiarVista('trabajos')">Trabajos</button>
      <button class="tab" data-v="fases" onclick="cambiarVista('fases')">Fases</button>
      <button class="tab" data-v="analisis" onclick="cambiarVista('analisis')">Análisis</button>
      <button class="tab" data-v="cronograma" onclick="cambiarVista('cronograma')">Cronograma</button>
      <button class="tab" data-v="materiales" onclick="cambiarVista('materiales')">Materiales</button>
      <button class="tab" data-v="espacios" onclick="cambiarVista('espacios')">Espacios</button>
      <button class="tab" data-v="contratistas" onclick="cambiarVista('contratistas')">Contratistas</button>
    </div>
    <div class="acciones">
      <span class="oculto" id="wrap-nuevo"><button id="btn-nuevo">+ Nuevo trabajo</button></span>
      <span class="oculto" id="wrap-fase"><button id="btn-fase">+ Nueva fase</button></span>
      <span class="oculto" id="wrap-material"><button id="btn-material">+ Nuevo material</button></span>
      <span class="oculto" id="wrap-categoria"><button id="btn-categoria">+ Nueva categoría</button></span>
      <span class="oculto" id="wrap-espacio"><button id="btn-espacio">+ Nuevo espacio</button></span>
      <span class="oculto" id="wrap-contratista"><button id="btn-contratista">+ Nuevo contratista</button></span>
    </div>
  </div>
</nav>

<main>
  <div id="lista"></div>
</main>

const hoyDia = () => { const t = new Date(); return Math.round(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / DIA); };
const fechaLarga = d => new Date(d * DIA).toLocaleDateString('es-PA', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
const fechaCorta = d => new Date(d * DIA).toLocaleDateString('es-PA', { day: 'numeric', month: 'short', timeZone: 'UTC' });

/* ---------- Selectores con icono y color ---------- */
function itemsDe(tipo) {
  if (tipo === 'espacio') return D.espacios;
  if (tipo === 'fase') return D.fases;
  if (tipo === 'categoria') return D.categorias;
  if (tipo === 'contratista') return D.contratistas.map(c => ({ ...c, letra: (c.nombre || '?').charAt(0).toUpperCase(), detalle: c.oficio || '' }));
  return D.partidas.map(p => ({ id: p.id, nombre: p.nombre }));
}

function iconoDe(it) {
  if (it.icono) return `<span class="ico" style="background:${it.color}22">${svgIcono(it.icono, it.color)}</span>`;
  if (it.letra) return `<span class="ico" style="background:${it.color}22;color:${it.color};font-weight:700">${esc(it.letra)}</span>`;
  if (it.color) return `<span class="punto" style="background:${it.color}"></span>`;
  return '';
}

function chipDe(it) {
  const c = it.color || '#6b7a75';
  return `<span class="chip" style="color:${c};border-color:${c}">${iconoDe(it)} ${esc(it.nombre)}</span>`;
}

function picker(name, tipo, sel, multi, vacio) {
  const items = itemsDe(tipo);
  const elegidos = items.filter(i => sel.includes(i.id));
  const resumen = elegidos.length ? elegidos.map(chipDe).join('') : `<span class="meta">${esc(vacio || 'Seleccionar…')}</span>`;
  const tipoInput = multi ? 'checkbox' : 'radio';
  const ninguno = multi ? '' : `<label class="pi"><input type="radio" name="${name}" value="" ${sel.length ? '' : 'checked'} onchange="pickerCambio(this)"><span class="meta">${esc(vacio || 'Ninguno')}</span></label>`;
  const opciones = ninguno + items.map(i => `
    <label class="pi"><input type="${tipoInput}" name="${name}" value="${i.id}" ${sel.includes(i.id) ? 'checked' : ''} onchange="pickerCambio(this)">
      ${iconoDe(i)} <span>${esc(i.nombre)}</span> ${i.detalle ? `<span class="meta">${esc(i.detalle)}</span>` : ''}</label>`).join('');
  return `<details class="picker" data-tipo="${tipo}" data-multi="${multi ? 1 : 0}">
    <summary>${resumen}</summary>
    <div class="picker-lista">${opciones || '<p class="meta">Aún no hay opciones. Créalas en su pestaña.</p>'}</div>
  </details>`;
}

function pickerCambio(input) {
  const det = input.closest('details');
  const multi = det.dataset.multi === '1';
  const ids = [...det.querySelectorAll('input:checked')].map(i => i.value).filter(Boolean);
  const items = itemsDe(det.dataset.tipo);
  det.querySelector('summary').innerHTML = ids.length
    ? items.filter(i => ids.includes(i.id)).map(chipDe).join('')
    : '<span class="meta">Seleccionar…</span>';
  if (!multi) det.open = false;
}

const marcados = name => [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(i => i.value).filter(Boolean);

function iconoTitulo(t) {
  t = t.toLowerCase();

  if (/presupuesto|gasto|comparativo|resumen|por mes|por categor|por tienda/.test(t)) return ICONOS_TIT.grafica;

// Cada título de la página recibe un color distinto (en orden) y un icono según su nombre
function decorarTitulos() {
  let i = 0;
  document.querySelectorAll('#lista .seccion h3, #lista .cr-sec, #lista .fase-bloque h3').forEach(el => {
    const col = COLORES_TIT[i++ % COLORES_TIT.length];
    el.classList.add('tit');
    el.style.setProperty('--tc', col);
    if (!el.querySelector('svg, .tit-ico')) {

      el.insertAdjacentHTML('afterbegin', `<span class="tit-ico" style="background:${col}1f">${dibujo}</span>`);
    }

/* ---------- Barras de progreso ---------- */
function barraProgreso(valor, total, tono) {
  const p = pct(valor, total);
  const clase = tono || (p >= 100 ? 'verde' : (p === 0 ? 'inicio' : ''));
  return `<div class="progreso ${clase}"><span style="width:${p.toFixed(1)}%"></span><b>${p.toFixed(0)}%</b></div>`;
}

/* ---------- Migración de datos ---------- */
function claveLibre(usadas) {
  let n = 1;
  while (usadas.has(String(n * 1000))) n++;
  return String(n * 1000);
}

function migrar(X) {
  X.espacios = X.espacios || [];
  X.fases = X.fases || [];
  X.fases.forEach(f => { if (!Array.isArray(f.espacioIds)) f.espacioIds = []; });
  X.categorias = X.categorias || [];
  X.contratistas = X.contratistas || [];
  X.partidas = X.partidas || [];
  X.materiales = X.materiales || [];
  X.partidas.forEach(p => {
    if (!p.espacioIds) p.espacioIds = p.espacioId ? [p.espacioId] : [];
    if (!p.contratistaIds) p.contratistaIds = p.contratistaId ? [p.contratistaId] : [];
    if (p.faseId === undefined) p.faseId = null;
    if (p.fechaInicio === undefined) p.fechaInicio = '';
    if (p.fechaFin === undefined) p.fechaFin = '';
    p.pagos = p.pagos || [];
    p.pagos.forEach(x => { if (!x.fotos) x.fotos = x.comprobante ? [x.comprobante] : []; });
  });
  X.materiales.forEach(m => {
    if (!m.espacioIds) m.espacioIds = m.espacioId ? [m.espacioId] : [];
    if (!m.contratistaIds) m.contratistaIds = m.contratistaId ? [m.contratistaId] : [];
    if (m.faseId === undefined) m.faseId = null;
    if (m.categoriaId === undefined) m.categoriaId = null;
    if (!m.fotos) m.fotos = m.foto ? [m.foto] : [];
  });
  X.contratistas.forEach(c => {
    if (!c.clave) {
      const usadas = new Set(X.contratistas.map(x => x.clave).filter(Boolean).concat(CLAVE_ADMIN));
      c.clave = claveLibre(usadas);
    }
  });
  return X;
}

/* ---------- Guardado automático en este navegador ---------- */
function cargarLocal() {
  try {
    const s = localStorage.getItem(CLAVE);
    if (!s) return;
    D = { ...D, ...JSON.parse(s) };
  } catch (e) { /* datos corruptos: se ignoran */ }
}

function guardarLocal() {
  D.actualizado = new Date().toISOString();
  try {
    localStorage.setItem(CLAVE, JSON.stringify(D));
  } catch (e) {
    alert('No se pudo guardar en el navegador (puede que haya demasiadas fotos).');
  }
}

/* ---------- Entrada, salida y render ---------- */
function init() {
  D = migrar(D);
  cargarLocal();
  D = migrar(D);
  guardarLocal();
  llenarEntrada();
  render();
}

function llenarEntrada() {
  const contrs = D.contratistas.map(c => `<option value="c:${c.id}">${esc(c.nombre)}${c.oficio ? ' – ' + esc(c.oficio) : ''}</option>`).join('');
  $('#puerta-quien').innerHTML = `<option value="">Selecciona tu nombre…</option>${contrs}<option value="admin">Administrador</option>`;
  $('#puerta-quien').value = '';
  $('#puerta-clave').classList.add('oculto');
  $('#puerta-error').textContent = '';
  pendiente = null;
}

function cambiaQuien(v) {
  pendiente = null;
  $('#puerta-error').textContent = '';
  $('#puerta-codigo').value = '';
  if (!v) { $('#puerta-clave').classList.add('oculto'); return; }
  if (v === 'admin') {
    pendiente = 'admin';
    $('#puerta-clave-txt').textContent = 'Código de administrador';
  } else {
    pendiente = v.slice(2);
    $('#puerta-clave-txt').textContent = `Código de ${contr(pendiente)?.nombre || ''}`;
  }
  $('#puerta-clave').classList.remove('oculto');
  setTimeout(() => $('#puerta-codigo').focus(), 50);
}

function entrarClave() {
  if (!pendiente) return;
  const escrito = $('#puerta-codigo').value.trim();
  const ok = pendiente === 'admin' ? escrito === CLAVE_ADMIN : (contr(pendiente)?.clave === escrito);
  if (!ok) {
    $('#puerta-error').textContent = 'Código incorrecto.';
    $('#puerta-codigo').value = '';
    $('#puerta-codigo').focus();
    return;
  }
  if (pendiente === 'admin') { modo = 'admin'; }
  else { modo = 'contratista'; contratistaActivo = pendiente; }
  pendiente = null;
  $('#puerta-codigo').value = '';
  irAHoy = true;
  render();
}

function salir() {
  modo = null;
  contratistaActivo = null;
  vista = 'trabajos';
  llenarEntrada();
  render();
}

function cambiar() {
  guardarLocal();
  render();
}

function cambiarVista(v) {
  vista = v;
  if (v === 'cronograma') irAHoy = true;
  render();
}

function render() {
  const admin = modo === 'admin';
  const contratista = modo === 'contratista';
  $('#puerta').classList.toggle('oculto', !!modo);
  document.body.classList.toggle('edita', admin);
  $('#btn-salir').classList.toggle('oculto', !modo);
  $('.menu').classList.toggle('oculto', !admin);
  $('#resumen').classList.toggle('oculto', !admin);
  $('#barra-global').classList.toggle('oculto', !admin);

  if (!modo) { $('#lista').innerHTML = ''; return; }

  if (contratista) {
    const c = contr(contratistaActivo);
    if (!c) { salir(); return; }
    $('#t-titulo').textContent = `Hola, ${c.nombre}`;
    $('#lista').innerHTML = vistaContratista(c);
    decorarTitulos();
    if (irAHoy) { irAHoy = false; centrarHoy(); }
    return;
  }

  $('#t-titulo').textContent = 'PH 33 Royal Palace';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('act', t.dataset.v === vista));
  $('#wrap-nuevo').classList.toggle('oculto', vista !== 'trabajos');
  $('#wrap-fase').classList.toggle('oculto', vista !== 'fases');
  $('#wrap-material').classList.toggle('oculto', vista !== 'materiales');
  $('#wrap-categoria').classList.toggle('oculto', vista !== 'materiales');
  $('#wrap-espacio').classList.toggle('oculto', vista !== 'espacios');
  $('#wrap-contratista').classList.toggle('oculto', vista !== 'contratistas');

  let pres = 0, pag = 0;
  D.partidas.forEach(p => { pres += +p.presupuesto || 0; pag += totalPagado(p); });
  $('#t-presup').textContent = fmt(pres);
  $('#t-pagado').textContent = fmt(pag);
  $('#t-pend').textContent = fmt(pres - pag);
  $('#t-barra').style.width = pct(pag, pres) + '%';

  const vistas = {
    trabajos: vistaTrabajos, fases: vistaFases, analisis: analisisGraficos, cronograma: vistaCronograma,
    materiales: vistaMateriales, espacios: vistaEspacios, contratistas: vistaContratistas
  };
  $('#lista').innerHTML = (vistas[vista] || vistaTrabajos)();
  decorarTitulos();
  if (irAHoy && vista === 'cronograma') { irAHoy = false; centrarHoy(); }
}

/* ---------- Espacios ---------- */
function vistaEspacios() {
  if (!D.espacios.length) return '<p class="meta">Aún no hay espacios. Crea uno con "+ Nuevo espacio" (ej. Comedor, Dormitorio).</p>';
  return `<div class="grid-esp">${D.espacios.map(e => {
    const ts = D.partidas.filter(p => p.espacioIds.includes(e.id));
    const ms = D.materiales.filter(m => m.espacioIds.includes(e.id));
    const pag = ts.reduce((a, p) => a + totalPagado(p), 0);
    const pres = ts.reduce((a, p) => a + (+p.presupuesto || 0), 0);
    return `
    <div class="card esp-card" style="border-top:5px solid ${e.color}">
      <div class="fila">
        <span class="ico big" style="background:${e.color}22">${svgIcono(e.icono, e.color)}</span>
        <span class="solo-dueno" style="display:flex;gap:4px">
          <button class="sec mini" onclick="editarColeccion('espacio','${e.id}')">✎</button>
          <button class="peligro mini" onclick="borrarColeccion('espacio','${e.id}')">×</button>
        </span>
      </div>
      <h2 style="margin-top:8px">${esc(e.nombre)}</h2>
      <div class="meta">${ts.length} trabajo(s) · ${ms.length} material(es) vinculados</div>
      <div class="meta">Pagado <b>${fmt(pag)}</b> de ${fmt(pres)}</div>
      <div class="meta">Materiales propios <b>${fmt(sumaMat(ms))}</b></div>
      ${barraProgreso(pag, pres)}
    </div>`;
  }).join('')}</div>`;
}

/* ---------- Colecciones (espacio, fase, categoría) ---------- */
function formEspacio(e = {}, tipo = 'espacio') {
  borrador = { tipo, icono: e.icono || 'casa', color: e.color || COLOR_DEFECTO };
  const titulo = tipo === 'fase' ? 'fase' : (tipo === 'categoria' ? 'categoría' : 'espacio');
  const ejemplo = tipo === 'fase' ? 'Ej.: Obra gruesa' : (tipo === 'categoria' ? 'Ej.: Luces' : 'Ej.: Comedor');
  const botones = Object.keys(ICONOS).map(k => `
    <button type="button" class="icono-btn ${borrador.icono === k ? 'sel' : ''}" data-k="${k}"
      onclick="elegirIcono('${k}')" title="${NOMBRES[k] || k}">${svgIcono(k, borrador.color)}</button>`).join('');
  const sw = PALETA.map(col => `
    <button type="button" class="swatch ${borrador.color === col ? 'sel' : ''}" data-col="${col}"
      style="background:${col}" onclick="cambiarColor('${col}')"></button>`).join('');
  abrirModal(`
    <h3 style="margin-top:0">${e.id ? 'Editar' : 'Nueva'} ${titulo}</h3>
    <label>Nombre</label>
    <input id="m-en" value="${esc(e.nombre)}" placeholder="${ejemplo}">

/* Confirmación dentro de la app (confirm() del navegador puede estar bloqueado) */
function confirmarBorrado(msg, accion) {
  abrirModal(`<h3 style="margin-top:0">Confirmar</h3>
    <p>${esc(msg)}</p>
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">
      <button class="sec" onclick="cerrarModal()">Cancelar</button>
      <button class="peligro" id="m-si">Eliminar</button>
    </div>`);
  $('#m-si').onclick = () => { cerrarModal(); accion(); };
}

function borrarColeccion(tipo, id) {
  const nombres = { fase: 'fase', categoria: 'categoría', espacio: 'espacio' };
  let usos = 0;
  if (tipo === 'fase') usos = D.partidas.filter(p => p.faseId === id).length + D.materiales.filter(m => m.faseId === id).length;
  if (tipo === 'categoria') usos = D.materiales.filter(m => m.categoriaId === id).length;
  if (tipo === 'espacio') usos = D.partidas.filter(p => p.espacioIds.includes(id)).length + D.materiales.filter(m => m.espacioIds.includes(id)).length;
  confirmarBorrado(`¿Eliminar ${tipo === 'espacio' ? 'este' : 'esta'} ${nombres[tipo]}?` + (usos ? ` Quedará quitada de ${usos} registro(s).` : ''), () => {
    if (tipo === 'fase') {
      D.fases = D.fases.filter(f => f.id !== id);
      D.partidas.forEach(p => { if (p.faseId === id) p.faseId = null; });
      D.materiales.forEach(m => { if (m.faseId === id) m.faseId = null; });
    } else if (tipo === 'categoria') {
      D.categorias = D.categorias.filter(c => c.id !== id);
      D.materiales.forEach(m => { if (m.categoriaId === id) m.categoriaId = null; });
    } else {
      D.espacios = D.espacios.filter(e => e.id !== id);
      D.partidas.forEach(p => { p.espacioIds = p.espacioIds.filter(x => x !== id); });
      D.materiales.forEach(m => { m.espacioIds = m.espacioIds.filter(x => x !== id); });
      D.fases.forEach(f => { f.espacioIds = (f.espacioIds || []).filter(x => x !== id); });
    }
    cambiar();
  });
}

function estadoTrabajo(p) {
  const pag = totalPagado(p), pres = +p.presupuesto || 0;
  if (pres > 0 && pag >= pres) return { t: 'Pagado', c: '#2f855a' };
  if (!p.fechaInicio) return { t: 'Sin fecha', c: '#8a9893' };
  const hoy = hoyDia(), ini = aDia(p.fechaInicio), fin = p.fechaFin ? aDia(p.fechaFin) : ini;
  if (hoy < ini) return { t: 'Pendiente', c: '#6b7a75' };
  if (hoy > fin) return { t: 'Atrasado', c: '#b5472b' };
  return { t: 'En curso', c: '#4a4fc4' };
}

function detallePagos(p, admin) {
  const filas = p.pagos.slice().sort((a, b) => a.fecha < b.fecha ? -1 : 1).map(x => `

      ${admin ? `<td class="solo-dueno"><button class="peligro mini" onclick="borrarPago('${p.id}','${x.id}')">×</button></td>` : ''}
    </tr>`).join('');
  return `

}

function comprimir(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, 1280 / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.72));
      };
      im.onerror = rej;
      im.src = r.result;
    };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

/* ---------- Cronograma (solo visualización: un cuadrito por día) ---------- */
function rangoCron(lista) {
  const hoy = hoyDia();
  let mn = hoy - 7, mx = hoy + 30;
  lista.forEach(p => {
    const a = aDia(p.fechaInicio);
    const b = p.fechaFin ? aDia(p.fechaFin) : a;
    mn = Math.min(mn, a);
    mx = Math.max(mx, b);
  });
  return { r0: mn - 2, r1: mx + 3 };
}

function cabeceraCron(r0, r1, px) {
  const dias = r1 - r0 + 1;
  const hoy = hoyDia();
  const meses = [];
  for (let d = r0; d <= r1; d++) {
    const dt = new Date(d * DIA);
    const k = dt.getUTCFullYear() + '-' + dt.getUTCMonth();
    if (!meses.length || meses[meses.length - 1].k !== k) {
      meses.push({ k, n: 0, d0: d, nombre: dt.toLocaleDateString('es-PA', { month: 'long', year: 'numeric', timeZone: 'UTC' }) });
    }
    meses[meses.length - 1].n++;
  }
  const filaMeses = meses.map(m => {
    const texto = m.n * px >= 150 ? m.nombre : m.nombre.split(' ')[0].slice(0, 3);
    return `<div class="cr-mes" style="left:${(m.d0 - r0) * px}px;width:${m.n * px}px">${esc(texto)}</div>`;
  }).join('');
  let filaDias = '';
  for (let d = r0; d <= r1; d++) {
    const dt = new Date(d * DIA);
    const dow = dt.getUTCDay();
    if (zoomCr === 'dia') {
      const clases = `${dow === 0 || dow === 6 ? ' fds' : ''}${d === hoy ? ' hoy' : ''}`;
      filaDias += `<div class="cr-dia${clases}" style="left:${(d - r0) * px}px;width:${px}px"><b>${dt.getUTCDate()}</b><small>${dt.toLocaleDateString('es-PA', { weekday: 'narrow', timeZone: 'UTC' })}</small></div>`;
    } else if (zoomCr === 'semana' && (dow === 1 || d === r0)) {
      const w = Math.min(7, r1 - d + 1);
      filaDias += `<div class="cr-dia sem${d <= hoy && hoy < d + w ? ' hoy' : ''}" style="left:${(d - r0) * px}px;width:${w * px}px"><b>${dt.getUTCDate()}</b> <small>${dt.toLocaleDateString('es-PA', { month: 'short', timeZone: 'UTC' })}</small></div>`;
    }
  }
  const altoDias = zoomCr === 'dia' ? 70 : (zoomCr === 'semana' ? 44 : 22);
  return `<div class="cr-head">
    <div class="cr-row" style="height:22px"><div class="cr-lbl" style="height:22px">Mes</div><div class="cr-tl" style="width:${dias * px}px;height:22px">${filaMeses}</div></div>
    <div class="cr-row" style="height:${altoDias - 22}px;border-bottom:1px solid var(--line)"><div class="cr-lbl" style="height:${altoDias - 22}px">${zoomCr === 'dia' ? 'Día' : (zoomCr === 'semana' ? 'Semana' : '')}</div><div class="cr-tl" style="width:${dias * px}px;height:${altoDias - 22}px">${zoomCr === 'mes' ? '' : filaDias}</div></div>
  </div>`;
}

// Columnas de fondo: fines de semana y hoy, que cruzan todas las filas
function capasCron(r0, r1, px) {
  const h = hoyDia();
  let s = '';
  for (let d = r0; d <= r1; d++) {
    const dow = new Date(d * DIA).getUTCDay();
    const left = `calc(var(--lbl) + ${(d - r0) * px}px)`;
    if (d === h) s += `<div class="cr-col hoy" style="left:${left};width:${px}px"></div>`;
    else if (dow === 0 || dow === 6) s += `<div class="cr-col fds" style="left:${left};width:${px}px"></div>`;
  }
  return s;
}

// Un trabajo es una fila de cuadritos: uno por día. Lo pagado se ve lleno; lo pendiente, claro.
function cuadradosTrabajo(p, r0, px, color) {
  const ini = aDia(p.fechaInicio);
  const fin = p.fechaFin ? aDia(p.fechaFin) : ini;
  const n = fin - ini + 1;
  const avance = pct(totalPagado(p), p.presupuesto);
  const pagados = Math.round(avance / 100 * n);
  const est = estadoTrabajo(p);
  let s = '';
  for (let i = 0; i < n; i++) {
    const d = ini + i;
    const pagado = i < pagados;
    const numero = px >= 26 ? new Date(d * DIA).getUTCDate() : '';
    s += `<div class="cr-cuad" style="left:${(d - r0) * px + 2}px;top:2px;width:${px - 4}px;height:${px - 4}px;background:${color};opacity:${pagado ? 1 : .32}"
      onclick="verCronTrabajo('${p.id}')"
      title="${esc(p.nombre)} · ${fechaLarga(d)} · ${est.t} · ${pagado ? 'pagado' : 'pendiente'}">${numero}</div>`;
  }
  return s;
}

function gruposPor(tipo, lista) {
  if (tipo === 'contratista') {
    const out = D.contratistas.map(c => ({ nombre: c.nombre, color: c.color, letra: (c.nombre || '?').charAt(0).toUpperCase(), items: lista.filter(p => p.contratistaIds.includes(c.id)) }));
    out.push({ nombre: 'Sin contratista', color: '#8a9893', items: lista.filter(p => !p.contratistaIds.length) });
    return out.filter(g => g.items.length);
  }
  if (tipo === 'espacio') {
    const out = D.espacios.map(e => ({ nombre: e.nombre, color: e.color, icono: e.icono, items: lista.filter(p => p.espacioIds.includes(e.id)) }));
    out.push({ nombre: 'Sin espacio', color: '#8a9893', items: lista.filter(p => !p.espacioIds.length) });
    return out.filter(g => g.items.length);
  }
  const out = D.fases.map(f => ({ nombre: f.nombre, color: f.color, icono: f.icono, items: lista.filter(p => p.faseId === f.id) }));
  out.push({ nombre: 'Sin fase', color: '#8a9893', items: lista.filter(p => !p.faseId) });
  return out.filter(g => g.items.length);
}

const TITULOS_SEC = { contratista: 'Por contratista', espacio: 'Por espacio', fase: 'Por fase' };

function filaCron(lbl, cuerpo, W, px, clase) {
  return `<div class="cr-row ${clase || ''}" style="height:${px}px">
    ${lbl}
    <div class="cr-tl" style="width:${W}px;height:${px}px;background-size:${px}px ${px}px">${cuerpo}</div>
  </div>`;
}

function cuerpoCron(datados, r0, r1, secciones) {
  const dias = r1 - r0 + 1;
  const px = PX[zoomCr];
  const W = dias * px;
  let html = `<div class="cr-wrap" id="cr-wrap" data-r0="${r0}"><div class="cr-inner">`;
  html += capasCron(r0, r1, px);
  html += cabeceraCron(r0, r1, px);
  secciones.forEach(sec => {
    const grupos = gruposPor(sec, datados);
    html += `<div class="cr-sec" style="width:calc(var(--lbl) + ${W}px);height:auto">${TITULOS_SEC[sec]}</div>`;
    if (!grupos.length) {
      html += `<div class="cr-row" style="height:${px}px"><div class="cr-lbl" style="height:${px}px">—</div><div class="cr-tl" style="width:${W}px;height:${px}px"></div></div>`;
    }
    grupos.forEach(g => {
      const icono = g.icono ? iconoDe({ icono: g.icono, color: g.color }) : iconoDe({ letra: g.letra, color: g.color });
      html += filaCron(`<div class="cr-lbl" style="height:${px}px">${icono}<span class="t"><b>${esc(g.nombre)}</b> <span class="meta">(${g.items.length})</span></span></div>`, '', W, px, 'cr-grupo');
      g.items.sort((a, b) => aDia(a.fechaInicio) - aDia(b.fechaInicio)).forEach(p => {
        html += filaCron(`<div class="cr-lbl cr-trab-lbl" style="height:${px}px;padding-left:18px" onclick="verCronTrabajo('${p.id}')"><span class="t">${esc(p.nombre)}</span></div>`,
          cuadradosTrabajo(p, r0, px, g.color), W, px);
      });
    });
  });
  return html + '</div></div>';
}

function controlesCron(admin) {
  const botonZoom = (z, t) => `<button class="cr-btn ${zoomCr === z ? 'act' : ''}" onclick="cambiarZoom('${z}')">${t}</button>`;
  const botonSec = (s) => admin ? `<button class="cr-btn ${secCr[s] ? 'act' : 'off'}" onclick="alternarSec('${s}')">${TITULOS_SEC[s]}</button>` : '';
  return `
    <div class="cr-controles no-imprimir">
      <div class="cr-grupo-btns">${botonZoom('dia', 'Día')}${botonZoom('semana', 'Semana')}${botonZoom('mes', 'Mes')}</div>
      <button class="cr-btn" onclick="centrarHoy()">Ir a hoy</button>
      ${admin ? `<div class="cr-grupo-btns">${botonSec('contratista')}${botonSec('espacio')}${botonSec('fase')}</div>` : ''}
    </div>
    <div class="cr-leyenda">
      <span><i class="cr-sq" style="background:#4a4fc4"></i> Día con avance pagado</span>
      <span><i class="cr-sq" style="background:#4a4fc4;opacity:.32"></i> Día pendiente</span>
      <span><i class="cr-sq" style="background:#fde8e6;border:1px solid #e0443a"></i> Hoy</span>
      <span>Toca un cuadrito o un nombre para ver el detalle.</span>
    </div>`;
}

function cambiarZoom(z) {
  const w = $('#cr-wrap');
  const ratio = w ? w.scrollLeft / Math.max(1, w.scrollWidth) : 0;
  zoomCr = z;
  render();
  const w2 = $('#cr-wrap');
  if (w2) w2.scrollLeft = ratio * w2.scrollWidth;
}

function alternarSec(s) {
  secCr[s] = !secCr[s];
  if (!Object.values(secCr).some(Boolean)) secCr[s] = true;
  render();
}

function centrarHoy() {
  const w = $('#cr-wrap');
  if (!w) return;
  const r0 = +w.dataset.r0 || 0;
  const px = PX[zoomCr];
  const x = (hoyDia() - r0) * px + px / 2;
  w.scrollLeft = Math.max(0, x - w.clientWidth / 2);
}

function sinFechaCron(lista) {
  if (!lista.length) return '';
  return `<div class="seccion cr-sinfecha"><h3>Sin fechas</h3>
    <p class="meta">Estos trabajos aún no aparecen en el cronograma. Las fechas se escriben al crear o editar el trabajo.</p>
    ${lista.map(p => `<span class="tag-s">${esc(p.nombre)}</span>`).join('')}
  </div>`;
}

function vistaCronograma() {
  if (!D.partidas.length) return '<p class="meta">Crea trabajos con fechas para verlos en el cronograma.</p>';
  const datados = D.partidas.filter(p => p.fechaInicio);
  const secciones = ['contratista', 'espacio', 'fase'].filter(s => secCr[s]);
  const { r0, r1 } = rangoCron(datados);
  const cuerpo = datados.length
    ? controlesCron(true) + cuerpoCron(datados, r0, r1, secciones)
    : controlesCron(true) + '<p class="meta">Ningún trabajo tiene fecha de inicio todavía.</p>';
  return cuerpo + sinFechaCron(D.partidas.filter(p => !p.fechaInicio));
}

function cronogramaContratista(c) {
  const lista = D.partidas.filter(p => p.contratistaIds.includes(c.id));
  const datados = lista.filter(p => p.fechaInicio);
  if (!lista.length) return '<p class="meta">Aún no tienes trabajos asignados.</p>';
  if (!datados.length) return '<p class="meta">Tus trabajos todavía no tienen fechas.</p>';
  const { r0, r1 } = rangoCron(datados);
  return controlesCron(false) + cuerpoCron(datados, r0, r1, ['fase']);
}

function verCronTrabajo(id) {
  const p = trab(id);
  const admin = modo === 'admin';
  const pag = totalPagado(p), pres = +p.presupuesto || 0;
  const est = estadoTrabajo(p);
  const ini = p.fechaInicio ? fechaLarga(aDia(p.fechaInicio)) : '—';
  const fin = p.fechaFin ? fechaLarga(aDia(p.fechaFin)) : (p.fechaInicio ? 'Mismo día' : '—');
  abrirModal(`
    <h3 style="margin-top:0">${esc(p.nombre)}</h3>
    <span class="tag" style="color:${est.c};border-color:${est.c}">${esc(est.t)}</span>
    <div style="margin:10px 0">${[...p.espacioIds.map(i => esp(i)), ...p.contratistaIds.map(i => contr(i))].filter(Boolean).map(chipDe).join('')}</div>
    ${barraProgreso(pag, pres)}
    <div class="meta">Presupuesto ${fmt(pres)} · Pagado ${fmt(pag)} · ${admin ? 'Pendiente' : 'Te falta'} ${fmt(pres - pag)}</div>
    <div class="fila-fechas" style="margin-top:12px">
      <div><label>Inicio</label><div>${ini}</div></div>
      <div><label>Fin</label><div>${fin}</div></div>
    </div>
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
      <button class="sec" onclick="cerrarModal()">Cerrar</button>
      ${admin ? `<button class="sec" onclick="cerrarModal();editarPartida('${p.id}')">Editar trabajo</button>` : ''}
    </div>`);
}

/* ---------- Materiales ---------- */
function stripCategorias() {
  if (!D.categorias.length) {
    return '<p class="meta" style="margin:0 0 12px">Aún no hay categorías. Crea una con "+ Nueva categoría" (ej. Luces, AC, Plomería).</p>';
  }
  return `<div class="strip">${D.categorias.map(c => `
    <span class="chip" style="color:${c.color};border-color:${c.color}">${iconoDe(c)} ${esc(c.nombre)}
      <span class="solo-dueno" style="display:inline-flex;gap:3px;margin-left:4px">
        <button class="sec mini" onclick="editarColeccion('categoria','${c.id}')">✎</button>
        <button class="peligro mini" onclick="borrarColeccion('categoria','${c.id}')">×</button>
      </span></span>`).join('')}</div>`;
}

function vistaMateriales() {
  const cabecera = stripCategorias();
  if (!D.materiales.length) return cabecera + '<p class="meta">Aún no hay materiales. Registra una compra con "+ Nuevo material".</p>';
  const propios = sumaMat(D.materiales);
  const orden = D.materiales.slice().sort((a, b) => a.fecha < b.fecha ? 1 : -1);
  const filas = orden.map(m => {
    const f = fase(m.faseId), t = trab(m.partidaId), c = cat(m.categoriaId);
    const etiquetas = [
      c ? chipDe(c) : '',
      f ? chipDe(f) : '',
      ...m.espacioIds.map(id => esp(id)).filter(Boolean).map(chipDe),
      ...m.contratistaIds.map(id => contr(id)).filter(Boolean).map(chipDe),
      t ? `<span class="meta">${esc(t.nombre)}</span>` : ''
    ].join('');
    return `
    <tr>
      <td>${esc(m.fecha)}</td>
      <td><b>${esc(m.tienda)}</b></td>
      <td>${esc(m.descripcion)}${m.cantidad ? ` <span class="meta">(${esc(m.cantidad)})</span>` : ''}
        ${m.incluidoEnPago ? '<span class="badge">incluido en pago a contratista</span>' : ''}
        <div>${etiquetas || '<span class="meta">Sin categoría, fase, espacio ni contratista</span>'}</div></td>
      <td class="num">${fmt(m.monto)}</td>
      <td>${m.fotos.length ? `<img class="miniatura" src="${m.fotos[0]}" onclick="verFotoMat('${m.id}')" title="Ver fotos"> ${m.fotos.length > 1 ? `<span class="meta">+${m.fotos.length - 1}</span>` : ''}` : '<span class="meta">—</span>'}</td>
      <td class="solo-dueno" style="white-space:nowrap">
        <button class="sec mini" onclick="editarMaterial('${m.id}')">✎</button>
        <button class="peligro mini" onclick="borrarMaterial('${m.id}')">×</button>
      </td>
    </tr>`;
  }).join('');
  return cabecera + `
    <p class="resumen-filtro">Compras propias sumadas: <b>${fmt(propios)}</b>
      <span class="meta">(los marcados como "incluido en pago" no se suman)</span></p>
    <table>
      <tr><th>Fecha</th><th>Tienda</th><th>Qué compré / para dónde</th><th class="num">Monto</th><th>Fotos</th><th class="solo-dueno"></th></tr>
      ${filas}
    </table>`;
}

function formMaterial(m = {}) {
  const opTra = D.partidas.map(p => `<option value="${p.id}" ${m.partidaId === p.id ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('');
  const hoy = new Date().toISOString().slice(0, 10);
  abrirModal(`
    <h3 style="margin-top:0">${m.id ? 'Editar' : 'Nuevo'} material</h3>
    <div class="fila-fechas">
      <div><label>Fecha</label><input type="date" id="mt-fecha" value="${m.fecha || hoy}"></div>
      <div><label>Monto ($)</label><input type="number" step="0.01" min="0" id="mt-monto" value="${m.monto ?? ''}"></div>
    </div>
    <label>Dónde lo compré (tienda)</label>
    <input id="mt-tienda" value="${esc(m.tienda)}" placeholder="Ej.: Home Depot, Ferretería Central">
    <label>Qué compré</label>
    <input id="mt-desc" value="${esc(m.descripcion)}" placeholder="Ej.: Cable 12 AWG, 100 m">
    <label>Cantidad (opcional)</label>
    <input id="mt-cant" value="${esc(m.cantidad)}" placeholder="Ej.: 3 rollos">
    <label>Categoría</label>
    ${picker('mt-cat', 'categoria', m.categoriaId ? [m.categoriaId] : [], false, 'Sin categoría')}
    <label>Fase</label>
    ${picker('mt-fase', 'fase', m.faseId ? [m.faseId] : [], false, 'Sin fase')}
    <label>Para qué espacios (puedes elegir varios)</label>
    ${picker('mt-esp', 'espacio', m.espacioIds || [], true)}
    <label>Para qué trabajo (opcional)</label>
    <select id="mt-tra" style="width:100%"><option value="">— Ninguno —</option>${opTra}</select>
    <label>Quién lo va a usar (puedes elegir varios)</label>
    ${picker('mt-con', 'contratista', m.contratistaIds || [], true)}
    <label class="chk" style="margin-top:10px;color:var(--txt);display:flex;align-items:center;gap:8px">
      <input type="checkbox" id="mt-inc" ${m.incluidoEnPago ? 'checked' : ''} style="width:auto;margin:0">
      Ya está incluido en un pago al contratista (no sumar)
    </label>
    <label>Fotos del recibo o producto (puedes elegir varias)</label>
    <input type="file" accept="image/*" multiple id="mt-foto" onchange="previsualizarMat()">
    <div id="mt-prev" class="prev-grid">${(m.fotos || []).map(s => `<img src="${s}">`).join('')}</div>
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
      <button class="sec" onclick="cerrarModal()">Cancelar</button>
      <button onclick="okMaterial('${m.id || ''}')">Guardar</button>
    </div>`);
}

function previsualizarMat() {
  const archivos = [...$('#mt-foto').files];
  $('#mt-prev').innerHTML = archivos.map(f => `<img src="${URL.createObjectURL(f)}">`).join('');
}

async function okMaterial(id) {
  const g = i => $('#mt-' + i).value;
  const tienda = g('tienda').trim(), desc = g('desc').trim(), fecha = g('fecha');
  const monto = parseFloat(g('monto'));
  if (!fecha || !tienda || !desc || !(monto > 0)) return alert('Completa fecha, tienda, qué compraste y monto.');

  const previas = id ? D.materiales.find(x => x.id === id).fotos : [];
  const nuevas = await Promise.all([...$('#mt-foto').files].map(comprimir));
  const datos = {
    fecha, tienda, descripcion: desc, cantidad: g('cant').trim(), monto,
    categoriaId: marcados('mt-cat')[0] || null,
    faseId: marcados('mt-fase')[0] || null, partidaId: g('tra') || null,
    espacioIds: marcados('mt-esp'), contratistaIds: marcados('mt-con'),
    incluidoEnPago: $('#mt-inc').checked, fotos: previas.concat(nuevas)
  };
  if (id) Object.assign(D.materiales.find(x => x.id === id), datos);
  else D.materiales.push({ id: uid(), ...datos });
  cerrarModal();
  cambiar();
}

function editarMaterial(id) { formMaterial(D.materiales.find(x => x.id === id)); }

function borrarMaterial(id) {
  confirmarBorrado('¿Eliminar esta compra de material?', () => {
    D.materiales = D.materiales.filter(x => x.id !== id);
    cambiar();
  });
}

function verFotoMat(id) {
  const m = D.materiales.find(x => x.id === id);
  galeria(m.fotos, `${esc(m.fecha)} · ${esc(m.tienda)} · ${esc(m.descripcion)} · ${fmt(m.monto)}`);
}

/* ---------- Vista del contratista ---------- */
function vistaContratista(c) {
  const T = D.partidas.filter(p => p.contratistaIds.includes(c.id));
  const M = D.materiales.filter(m => m.contratistaIds.includes(c.id));
  const pres = T.reduce((a, p) => a + (+p.presupuesto || 0), 0);
  const pag = T.reduce((a, p) => a + totalPagado(p), 0);
  const pendiente = pres - pag;
  const mat = sumaMat(M);

  const idsFases = [...new Set([...T.map(p => p.faseId || null), ...M.map(m => m.faseId || null)])];
  const grupos = [
    ...D.fases.filter(f => idsFases.includes(f.id)).map(f => ({ id: f.id, nombre: f.nombre, color: f.color, icono: f.icono })),
    ...(idsFases.includes(null) ? [{ id: null, nombre: 'Sin fase', color: '#8a9893' }] : [])
  ];

  const bloques = grupos.map(g => {
    const Tg = T.filter(p => (p.faseId || null) === g.id);
    const Mg = M.filter(m => (m.faseId || null) === g.id);
    const presG = Tg.reduce((a, p) => a + (+p.presupuesto || 0), 0);
    const pagG = Tg.reduce((a, p) => a + totalPagado(p), 0);
    return `
    <div class="fase-bloque" style="border-color:${g.color}">
      <h3>${g.icono ? svgIcono(g.icono, g.color) + ' ' : ''}${esc(g.nombre)}</h3>
      <div class="meta">Pagado ${fmt(pagG)} de ${fmt(presG)} · Te faltan ${fmt(presG - pagG)} · Materiales ${fmt(sumaMat(Mg))}</div>
      ${presG ? barraProgreso(pagG, presG) : ''}
    </div>
    <div class="seccion"><h3>Trabajos</h3>
      ${Tg.length ? Tg.map(p => {
        const pg = totalPagado(p);
        return `<details class="trab">
          <summary>
            <b>${esc(p.nombre)}</b>
            <div>${p.espacioIds.map(id => esp(id)).filter(Boolean).map(chipDe).join('') || '<span class="meta">Sin espacio asignado</span>'}</div>
            ${barraProgreso(pg, p.presupuesto, pg > (+p.presupuesto || 0) ? 'alerta' : '')}
            <span class="meta">Presupuesto ${fmt(p.presupuesto)} · Pagado ${fmt(pg)} · Te falta ${fmt((+p.presupuesto || 0) - pg)}</span>
          </summary>
          ${detallePagos(p, false)}
        </details>`;
      }).join('') : '<p class="meta">Sin trabajos en esta fase.</p>'}
    </div>
    <div class="seccion"><h3>Materiales</h3>
      ${Mg.length ? `<div style="overflow-x:auto"><table><tr><th>Fecha</th><th>Categoría</th><th>Tienda</th><th>Qué se compró</th><th>Espacios</th><th class="num">Monto</th><th>Fotos</th></tr>
        ${Mg.map(m => `<tr>
          <td>${esc(m.fecha)}</td>
          <td>${cat(m.categoriaId) ? chipDe(cat(m.categoriaId)) : '—'}</td>
          <td>${esc(m.tienda)}</td>
          <td>${esc(m.descripcion)}${m.cantidad ? ` <span class="meta">(${esc(m.cantidad)})</span>` : ''}</td>
          <td>${m.espacioIds.map(id => esp(id)).filter(Boolean).map(chipDe).join('') || '—'}</td>
          <td class="num">${fmt(m.monto)}${m.incluidoEnPago ? ' <span class="badge">incluido en pago</span>' : ''}</td>
          <td>${m.fotos.length ? `<img class="miniatura" src="${m.fotos[0]}" onclick="verFotoMat('${m.id}')"> ${m.fotos.length > 1 ? `<span class="meta">+${m.fotos.length - 1}</span>` : ''}` : '—'}</td>
        </tr>`).join('')}</table></div>` : '<p class="meta">Sin materiales en esta fase.</p>'}
    </div>`;
  }).join('');

  return `
    <div class="saludo">
      <h2>${esc(c.nombre)}${c.oficio ? ' · ' + esc(c.oficio) : ''}</h2>
      <div class="meta">Tu avance de pagos</div>
      ${barraProgreso(pag, pres)}
      <div class="meta">Pagado ${fmt(pag)} de ${fmt(pres)} · Te faltan ${fmt(pendiente)}</div>
    </div>
    <div class="resumen-c">
      <div class="kpi"><span>Presupuesto de tus trabajos</span><b>${fmt(pres)}</b></div>
      <div class="kpi"><span>Ya pagado</span><b>${fmt(pag)}</b></div>
      <div class="kpi"><span>Te falta por pagar</span><b>${fmt(pendiente)}</b></div>

function descargarReporteContratista() {
  const c = contr(contratistaActivo);
  const T = D.partidas.filter(p => p.contratistaIds.includes(c.id));
  const M = D.materiales.filter(m => m.contratistaIds.includes(c.id));
  descargar(generarReporte(T, M, `Contratista: ${c.nombre}`), `reporte-${c.nombre.replace(/\s+/g, '-').toLowerCase()}-${hoyTxt()}.html`);
}

/* ---------- Análisis: filtros ---------- */
function setFiltro(tipo, valor) {
  if (tipo === 'esp') fEsp = valor;
  else if (tipo === 'con') fCon = valor;
  else fCat = valor;
  render();
}

function limpiarFiltros() { fEsp = 'todos'; fCon = 'todos'; fCat = 'todos'; render(); }

function cumpleFiltro(x) {
  const ids = x.espacioIds || [], cids = x.contratistaIds || [];
  const okE = fEsp === 'todos' || (fEsp === 'ninguno' ? ids.length === 0 : ids.includes(fEsp));
  const okC = fCon === 'todos' || (fCon === 'ninguno' ? cids.length === 0 : cids.includes(fCon));
  return okE && okC;
}

function trabajosFiltrados() { return D.partidas.filter(cumpleFiltro); }

function materialesFiltrados() {
  return D.materiales.filter(m => cumpleFiltro(m) &&
    (fCat === 'todos' || (fCat === 'ninguno' ? !m.categoriaId : m.categoriaId === fCat)));
}

function nombreFiltro(tipo) {
  if (tipo === 'cat') {
    if (fCat === 'todos') return 'Todas';
    if (fCat === 'ninguno') return 'Sin categoría';
    return cat(fCat)?.nombre || 'Todas';
  }
  const v = tipo === 'esp' ? fEsp : fCon;
  if (v === 'todos') return 'Todos';
  if (v === 'ninguno') return tipo === 'esp' ? 'Sin espacio' : 'Sin contratista';
  const x = tipo === 'esp' ? esp(v) : contr(v);
  return x ? x.nombre : 'Todos';
}

function barraFiltros() {
  const opt = (v, texto, actual) => `<option value="${v}" ${actual === v ? 'selected' : ''}>${esc(texto)}</option>`;
  const opE = opt('todos', 'Todos los espacios', fEsp) + opt('ninguno', 'Sin espacio', fEsp) +
    D.espacios.map(e => opt(e.id, e.nombre, fEsp)).join('');
  const opC = opt('todos', 'Todos los contratistas', fCon) + opt('ninguno', 'Sin contratista', fCon) +
    D.contratistas.map(c => opt(c.id, c.nombre, fCon)).join('');
  const opK = opt('todos', 'Todas las categorías', fCat) + opt('ninguno', 'Sin categoría', fCat) +
    D.categorias.map(c => opt(c.id, c.nombre, fCat)).join('');
  const activo = fEsp !== 'todos' || fCon !== 'todos' || fCat !== 'todos';
  return `
    <div class="filtros no-imprimir">
      <div class="campo"><span>Espacio</span><select onchange="setFiltro('esp', this.value)">${opE}</select></div>
      <div class="campo"><span>Contratista</span><select onchange="setFiltro('con', this.value)">${opC}</select></div>
      <div class="campo"><span>Categoría (solo materiales)</span><select onchange="setFiltro('cat', this.value)">${opK}</select></div>
      ${activo ? '<button class="sec" onclick="limpiarFiltros()">Limpiar filtros</button>' : ''}
      <button class="sec" onclick="descargarReporte()">Descargar reporte</button>
      <button class="sec" onclick="descargarCSV()">Descargar Excel (CSV)</button>
      <button class="sec" onclick="window.print()">Imprimir / PDF</button>
    </div>`;
}

/* ---------- Reportes descargables ---------- */
function descargar(contenido, nombre, tipo = 'text/html') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([contenido], { type: tipo + ';charset=utf-8' }));
  a.download = nombre;
  a.click();
  URL.revokeObjectURL(a.href);
}

const hoyTxt = () => new Date().toISOString().slice(0, 10);

function descargarReporte() {
  const T = trabajosFiltrados(), M = materialesFiltrados();
  const sub = `Espacio: ${nombreFiltro('esp')} · Contratista: ${nombreFiltro('con')} · Categoría: ${nombreFiltro('cat')}`;
  descargar(generarReporte(T, M, sub), `reporte-ph33-${hoyTxt()}.html`);
}

function descargarCSV() {
  const T = trabajosFiltrados(), M = materialesFiltrados();
  descargar(csvMovimientos(T, M), `movimientos-ph33-${hoyTxt()}.csv`, 'text/csv');
}

function csvMovimientos(T, M) {
  const celda = v => `"${String(v ?? '').replace(/"/g, '""')}"`;

  T.forEach(p => p.pagos.forEach(x => filas.push(['Pago', x.fecha, p.nombre, x.concepto, '', '', nombreFase(p.faseId), nombresEsp(p), nombresCon(p), x.monto, ''])));
  M.forEach(m => filas.push(['Material', m.fecha, m.descripcion + (m.cantidad ? ' (' + m.cantidad + ')' : ''), '', m.tienda, nombreCat(m.categoriaId), nombreFase(m.faseId), nombresEsp(m), nombresCon(m), m.monto, m.incluidoEnPago ? 'Sí' : 'No']));

/* ---------- Gráficas ---------- */
const corto = s => String(s ?? '').length > 9 ? String(s).slice(0, 8) + '…' : String(s);
const kf = n => Math.abs(n) >= 1000 ? (n / 1000).toFixed(1).replace('.0', '') + 'k' : String(Math.round(n));
const normTienda = s => String(s || '').trim().replace(/\s+/g, ' ');

// Reparte un monto en partes iguales entre los ids dados (o "ninguno" si no hay)
function sumarPor(items, idsDe, montoDe, valor2De) {
  const out = {};
  items.forEach(it => {
    const ids = idsDe(it) || [];
    const lista = ids.length ? ids : ['ninguno'];
    const m = montoDe(it) / lista.length;
    const p = valor2De ? valor2De(it) / lista.length : 0;
    lista.forEach(k => {
      out[k] = out[k] || { valor: 0, valor2: 0 };
      out[k].valor += m;
      out[k].valor2 += p;
    });
  });
  return out;
}

function pieSVG(datos) {
  const pos = datos.filter(d => d.valor > 0);
  const total = pos.reduce((a, d) => a + d.valor, 0);
  if (!total) return '<p class="meta">Sin gastos registrados todavía.</p>';
  const C = 100, R = 96, r = 56;
  const punto = t => [C + R * Math.cos(t), C + R * Math.sin(t)].map(v => v.toFixed(2));
  let ang = -Math.PI / 2, paths = '';
  pos.forEach(d => {
    if (pos.length === 1) { paths += `<circle cx="${C}" cy="${C}" r="${R}" fill="${d.color}"/>`; return; }
    const frac = d.valor / total;
    const a2 = ang + frac * 2 * Math.PI;
    const [x1, y1] = punto(ang), [x2, y2] = punto(a2);
    paths += `<path d="M${C} ${C}L${x1} ${y1}A${R} ${R} 0 ${frac > 0.5 ? 1 : 0} 1 ${x2} ${y2}Z" fill="${d.color}" stroke="#fff" stroke-width="2">
      <title>${esc(d.label)}: ${fmt(d.valor)} (${(frac * 100).toFixed(1)}%)</title></path>`;
    ang = a2;
  });
  paths += `<circle cx="${C}" cy="${C}" r="${r}" fill="#fff"/>
    <text x="${C}" y="${C - 2}" text-anchor="middle" font-size="11" fill="#6b7a75">Total</text>
    <text x="${C}" y="${C + 14}" text-anchor="middle" font-size="12" font-weight="700" fill="#1d2b27">${fmt(total)}</text>`;
  const leyenda = pos.map(d => `
    <div class="leyenda-item">
      ${d.icono || d.letra ? iconoDe({ icono: d.icono, letra: d.letra, color: d.color }) : `<span class="punto" style="background:${d.color}"></span>`}
      <span>${esc(d.label)}</span>
      <b>${fmt(d.valor)}</b>
      <span class="meta">${(d.valor / total * 100).toFixed(0)}%</span>
    </div>`).join('');
  return `<div class="pie-wrap"><svg viewBox="0 0 200 200" class="pie" role="img">${paths}</svg><div class="leyenda">${leyenda}</div></div>`;
}

// items: [{label, valor, color, valor2?}]. Si dobles=true dibuja presupuesto (valor2) junto a pagado (valor).
function columnasSVG(items, dobles) {
  if (!items.length) return '<p class="meta">Sin datos</p>';
  const H = 230, base = 190, top = 24, slot = 78;
  const W = Math.max(340, items.length * slot + 20);
  const max = Math.max(1, ...items.flatMap(i => [i.valor, i.valor2 || 0]));
  const bw = dobles ? 22 : 36;
  const cols = items.map((it, i) => {
    const cx = 10 + i * slot + slot / 2;
    const barra = (v, x, color, titulo) => {
      const h = (v / max) * (base - top), y = base - h;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${color}"><title>${titulo}</title></rect>
        <text x="${x + bw / 2}" y="${y - 4}" text-anchor="middle" font-size="10" fill="#1d2b27">${v ? kf(v) : ''}</text>`;
    };
    const g = dobles
      ? barra(it.valor2 || 0, cx - bw - 2, '#cfd9d4', `Presupuesto: ${fmt(it.valor2)}`) + barra(it.valor, cx + 2, it.color, `Pagado: ${fmt(it.valor)}`)
      : barra(it.valor, cx - bw / 2, it.color, `${esc(it.label)}: ${fmt(it.valor)}`);
    return g + `<text x="${cx}" y="${base + 16}" text-anchor="middle" font-size="10" fill="#6b7a75">${esc(corto(it.label))}</text>`;
  }).join('');
  return `<div class="svg-wrap"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">
    <line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="#dde3e0"/>${cols}</svg></div>`;
}

  const matTotal = sumaMat(M);

  const sEsp = sumarPor(T, p => p.espacioIds, totalPagado);
  const listaEsp = [...D.espacios.map(e => ({ k: e.id, label: e.nombre, icono: e.icono, color: e.color })),
    { k: 'ninguno', label: 'Sin espacio', color: '#8a9893' }];
  const pieEsp = pieSVG(listaEsp.map(e => ({ ...e, valor: sEsp[e.k]?.valor || 0 })).sort((a, b) => b.valor - a.valor));

  const sCon = sumarPor(T, p => p.contratistaIds, totalPagado);
  const listaCon = [...D.contratistas.map(c => ({ k: c.id, label: c.nombre, letra: (c.nombre || '?').charAt(0).toUpperCase(), color: c.color })),
    { k: 'ninguno', label: 'Sin contratista', color: '#8a9893' }];
  const pieCon = pieSVG(listaCon.map(c => ({ ...c, valor: sCon[c.k]?.valor || 0 })).sort((a, b) => b.valor - a.valor));

  const sCat = sumarPor(Mp, m => m.categoriaId ? [m.categoriaId] : [], m => +m.monto || 0);
  const listaCat = [...D.categorias.map(c => ({ k: c.id, label: c.nombre, icono: c.icono, color: c.color })),
    { k: 'ninguno', label: 'Sin categoría', color: '#8a9893' }];
  const pieCat = pieSVG(listaCat.map(c => ({ ...c, valor: sCat[c.k]?.valor || 0 })).sort((a, b) => b.valor - a.valor));
  const colCat = columnasSVG(listaCat.filter(c => (sCat[c.k]?.valor || 0) > 0).map(c => ({
    label: c.label, valor: sCat[c.k].valor, color: c.color
  })), false);

  const gTienda = {};
  Mp.forEach(m => {
    const k = normTienda(m.tienda).toLowerCase() || '—';
    gTienda[k] = gTienda[k] || { label: normTienda(m.tienda) || 'Sin tienda', valor: 0 };
    gTienda[k].valor += +m.monto || 0;
  });
  const pieTienda = pieSVG(Object.values(gTienda).sort((a, b) => b.valor - a.valor)
    .map((t, i) => ({ ...t, color: PALETA[i % PALETA.length] })));

  const sMatEsp = sumarPor(Mp, m => m.espacioIds, m => +m.monto || 0);
  const espacioBase = fEsp === 'todos' ? D.espacios : D.espacios.filter(e => e.id === fEsp);

  const sPresCon = sumarPor(T, p => p.contratistaIds, totalPagado, p => +p.presupuesto || 0);
  const colCon = columnasSVG(cons.map(c => ({
    label: c.nombre, valor: sPresCon[c.id]?.valor || 0, valor2: sPresCon[c.id]?.valor2 || 0, color: c.color
  })), true);

  const colTrabajos = columnasSVG(T.map(p => {

    ${fCon === 'todos' ? `<div class="seccion"><h3>Gasto pagado por contratista</h3>${pieCon}</div>` : ''}
    <div class="seccion"><h3>Presupuesto vs. pagado por contratista</h3>
      <div class="meta" style="margin-bottom:6px">
        <span class="punto" style="background:#cfd9d4"></span> Presupuesto &nbsp;

    </div>
    ${fEsp === 'todos' ? `<div class="seccion"><h3>Gasto pagado por espacio</h3>${pieEsp}</div>` : ''}
    <div class="seccion"><h3>Gasto total por espacio (pagos + materiales propios)</h3>${colEspacio}</div>
    <div class="seccion"><h3>Materiales propios por tienda</h3>${Mp.length ? pieTienda : '<p class="meta">Sin compras propias registradas.</p>'}</div>
    <div class="seccion"><h3>Presupuesto vs. pagado por trabajo</h3>
      <div class="meta" style="margin-bottom:6px">
        <span class="punto" style="background:#cfd9d4"></span> Presupuesto &nbsp;
        <span class="punto" style="background:#4a4fc4"></span> Pagado (el color indica el primer espacio)
      </div>
      ${colTrabajos}
    </div>
    <div class="seccion"><h3>Gasto por mes</h3>${colMes}</div>
    <div class="seccion"><h3>Pagos recientes</h3>
      ${recientes ? `<table><tr><th>Fecha</th><th>Trabajo</th><th>Descripción</th><th class="num">Monto</th></tr>${recientes}</table>` : '<p class="meta">Sin pagos registrados</p>'}
    </div>
    <div class="seccion"><h3>Materiales recientes</h3>
      ${matRecientes ? `<table><tr><th>Fecha</th><th>Categoría</th><th>Tienda</th><th>Qué compré</th><th class="num">Monto</th></tr>${matRecientes}</table>` : '<p class="meta">Sin compras propias registradas</p>'}
    </div>`;
}

/* ---------- Fases: gestión y análisis en una sola página ---------- */
function vistaFases() {
  const tarjetas = D.fases.length ? `<div class="grid-esp">${D.fases.map(f => {
    const ts = D.partidas.filter(p => p.faseId === f.id);
    const ms = D.materiales.filter(m => m.faseId === f.id);
    const total = ts.reduce((a, p) => a + totalPagado(p), 0) + sumaMat(ms);
    return `
    <div class="card esp-card" style="border-top:5px solid ${f.color}">
      <div class="fila">
        <span class="ico big" style="background:${f.color}22">${svgIcono(f.icono, f.color)}</span>
        <span class="solo-dueno" style="display:flex;gap:4px">
          <button class="sec mini" onclick="editarColeccion('fase','${f.id}')">✎</button>
          <button class="peligro mini" onclick="borrarColeccion('fase','${f.id}')">×</button>
        </span>
      </div>
      <h2 style="margin-top:8px">${esc(f.nombre)}</h2>
      <div class="meta">${ts.length} trabajo(s) · ${ms.length} material(es)</div>
      <div class="meta">Gasto real <b>${fmt(total)}</b></div>
      <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">${(f.espacioIds || []).length ? D.espacios.filter(e => f.espacioIds.includes(e.id)).map(chipDe).join('') : '<span class="meta">Sin espacios asignados</span>'}</div>
    </div>`;
  }).join('')}</div>` : '<p class="meta">Aún no hay fases. Crea una con "+ Nueva fase" (ej. Obra gruesa, Acabados, Pintura).</p>';

  return `${tarjetas}${analisisFases()}`;
}

function analisisFases() {
  if (!D.partidas.length && !D.materiales.length) return '';
  const grupos = [
    ...D.fases.map(f => ({ id: f.id, nombre: f.nombre, color: f.color, icono: f.icono })),
    { id: null, nombre: 'Sin fase', color: '#8a9893', icono: null }
  ];
  const datos = grupos.map(g => {
    const T = D.partidas.filter(p => (p.faseId || null) === g.id);
    const M = D.materiales.filter(m => (m.faseId || null) === g.id);
    const pres = T.reduce((a, p) => a + (+p.presupuesto || 0), 0);
    const pag = T.reduce((a, p) => a + totalPagado(p), 0);
    const mat = sumaMat(M);
    return { ...g, T, M, pres, pag, mat, total: pag + mat };
  }).filter(d => d.T.length || d.M.length);

  const granTotal = datos.reduce((a, d) => a + d.total, 0);
  const pie = pieSVG(datos.map(d => ({ label: d.nombre, valor: d.total, color: d.color, icono: d.icono })));
  const col = columnasSVG(datos.map(d => ({ label: d.nombre, valor: d.total, color: d.color })), false);

  const resumen = datos.map(d => `<tr>
      <td>${chipDe({ nombre: d.nombre, color: d.color, icono: d.icono })}</td>
      <td class="num">${d.T.length}</td><td class="num">${d.M.length}</td>
      <td class="num">${fmt(d.pres)}</td><td class="num">${fmt(d.pag)}</td>
      <td class="num">${fmt(d.mat)}</td><td class="num"><b>${fmt(d.total)}</b></td>
      <td class="num">${pct(d.total, granTotal).toFixed(0)}%</td></tr>`).join('');

  const detalle = datos.map(d => `
    <div class="fase-bloque" style="border-color:${d.color}">
      <h3>${d.icono ? svgIcono(d.icono, d.color) + ' ' : ''}${esc(d.nombre)}</h3>
      <div class="meta">Gasto real <b>${fmt(d.total)}</b> · ${d.T.length} trabajo(s) · ${d.M.length} material(es)</div>
    </div>
    <div class="seccion"><h3>Trabajos</h3>
      ${d.T.length ? `<div style="overflow-x:auto"><table><tr><th>Trabajo</th><th>Espacios</th><th>Contratistas</th><th class="num">Presupuesto</th><th class="num">Pagado</th><th class="num">Pendiente</th></tr>
        ${d.T.map(p => `<tr><td>${esc(p.nombre)}</td>
          <td>${p.espacioIds.map(id => esp(id)).filter(Boolean).map(chipDe).join('') || '—'}</td>
          <td>${p.contratistaIds.map(id => contr(id)).filter(Boolean).map(chipDe).join('') || '—'}</td>
          <td class="num">${fmt(p.presupuesto)}</td><td class="num">${fmt(totalPagado(p))}</td><td class="num">${fmt((+p.presupuesto || 0) - totalPagado(p))}</td></tr>`).join('')}
        </table></div>` : '<p class="meta">Sin trabajos en esta fase.</p>'}
    </div>
    <div class="seccion"><h3>Materiales</h3>
      ${d.M.length ? `<div style="overflow-x:auto"><table><tr><th>Fecha</th><th>Categoría</th><th>Tienda</th><th>Qué compré</th><th>Espacios</th><th>Contratistas</th><th class="num">Monto</th></tr>
        ${d.M.map(m => `<tr><td>${esc(m.fecha)}</td><td>${cat(m.categoriaId) ? chipDe(cat(m.categoriaId)) : '—'}</td><td>${esc(m.tienda)}</td><td>${esc(m.descripcion)}</td>
          <td>${m.espacioIds.map(id => esp(id)).filter(Boolean).map(chipDe).join('') || '—'}</td>
          <td>${m.contratistaIds.map(id => contr(id)).filter(Boolean).map(chipDe).join('') || '—'}</td>
          <td class="num">${fmt(m.monto)}${m.incluidoEnPago ? ' <span class="badge">incluido</span>' : ''}</td></tr>`).join('')}
        </table></div>` : '<p class="meta">Sin materiales en esta fase.</p>'}
    </div>`).join('');

  return `
    <div class="filtros no-imprimir">
      <button class="sec" onclick="descargarReporte()">Descargar reporte</button>
      <button class="sec" onclick="descargarCSV()">Descargar Excel (CSV)</button>
      <button class="sec" onclick="window.print()">Imprimir / PDF</button>
    </div>
    <div class="kpis">
      <div class="kpi"><span>Gasto real total</span><b>${fmt(granTotal)}</b></div>
      <div class="kpi"><span>Fases con movimientos</span><b>${datos.length}</b></div>
    </div>
    <div class="seccion"><h3>Gasto real por fase</h3>${pie}</div>
    <div class="seccion"><h3>Comparativo por fase</h3>${col}</div>
    <div class="seccion"><h3>Resumen</h3>
      <div style="overflow-x:auto"><table><tr><th>Fase</th><th class="num">Trabajos</th><th class="num">Materiales</th><th class="num">Presupuesto</th><th class="num">Pagado</th><th class="num">Materiales propios</th><th class="num">Total real</th><th class="num">%</th></tr>
        ${resumen || '<tr><td colspan="8" class="meta">Sin datos</td></tr>'}
      </table></div>
    </div>
    ${detalle}`;
}

/* ---------- Modal ---------- */
function abrirModal(html) {
  $('#modal-cont').innerHTML = html;
  $('#modal').classList.add('abierto');
}
function cerrarModal() {
  $('#modal').classList.remove('abierto');
  $('#modal-cont').innerHTML = '';
}
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') cerrarModal(); });

/* ---------- Botones ---------- */
$('#btn-salir').onclick = salir;
$('#btn-nuevo').onclick = () => formPartida();
$('#btn-material').onclick = () => formMaterial();
$('#btn-categoria').onclick = () => formEspacio({}, 'categoria');
$('#btn-espacio').onclick = () => formEspacio({}, 'espacio');
$('#btn-fase').onclick = () => formEspacio({}, 'fase');
$('#btn-contratista').onclick = () => formContratista();

init();
</script>
